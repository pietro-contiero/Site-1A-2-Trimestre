<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu site</title> 
        <style> 
        * {
            box-sizing: border-box;
        }

        header {
            background-color: #1f1a1a;
            color: #f37a09;
            text-align: center; 
            max-width: 800px;  
            margin: 0 auto 16px auto; 
            border: 5px solid #f37a09; 
            padding: 16px;
        }

        main {
            background-color: #1e1717;
            color: #f37a09;
            text-align: center; 
            max-width: 800px;  
            margin: 0 auto;
            border: 5px solid #f37a09;  
            padding: 16px;
        }

        /* Estilização da imagem para alinhar com o container */
        main img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 16px auto;
            border-radius: 4px; /* Opcional: suaviza as pontas da imagem */
        }
        </style>
    </head>
    <body>
        <header>       
            <h1>Confecção de bolachas</h1> 
            <p>Sejam bem-vindos ao Confecção de bolachas, aqui você encontra receitas e dicas maravilhosas sobre a arte de fazer bolachas. Conheça um pouco sobre bolachas.</p>
        </header>

        <main>
            <img src="imagem-blog.png" alt="Banner de 'Confecção de Bolachas: Biscoitos Artesanais & Receitas Caseiras' com ilustrações de biscoitos sobre fundo laranja.">
            <h2>Receitas</h2>
            <p>Conheça um pouco sobre bolachas</p>
            <p>Por: Pietro Contiero</p>
        </main>
    </body>
</html>
